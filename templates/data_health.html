<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Health</title>
<style>
  :root {
    --bg: #f2f3f7; --card: #ffffff; --border: #e7e8ee; --border-soft: #f1f2f6;
    --text: #14161c; --muted: #767b87; --muted-2: #a2a7b3;
    --up: #0e9f6e; --up-soft: #e6f7f0; --down: #e0434a; --down-soft: #fdedee;
    --accent: #4f5fe0; --accent-dark: #3d4cc7; --accent-soft: #eceefc;
    --amber: #b7791f; --amber-soft: #fdf1dc;
    --radius: 14px; --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(20,22,30,.04), 0 6px 16px rgba(20,22,30,.05);
    --shadow-sm: 0 1px 2px rgba(20,22,30,.05);
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); color: var(--text); }

  .topbar { display: flex; align-items: center; gap: 10px; padding: 14px 28px; background: var(--card); border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); flex-wrap: wrap; }
  .topbar h1 { font-size: 16px; margin: 0 6px 0 0; font-weight: 800; letter-spacing: -0.01em; }
  a.navlink { font-size: 12.5px; font-weight: 600; color: var(--muted); text-decoration: none; background: var(--bg); border: 1px solid transparent; border-radius: 999px; padding: 6px 14px; }
  a.navlink:hover { background: var(--accent-soft); color: var(--accent-dark); }
  a.navlink.active { background: var(--accent); color: #fff; font-weight: 700; pointer-events: none; }
  button { font-family: inherit; cursor: pointer; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13px; background: #fff; color: var(--text); }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; box-shadow: var(--shadow-sm); }
  button.primary:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }

  .page { padding: 22px 28px; display: flex; flex-direction: column; gap: 20px; max-width: 1100px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); }
  .panel-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .panel-title h2 { font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0; }

  .status-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 14px; }
  .stat { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; }
  .stat .label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
  .stat .value { font-size: 16px; font-weight: 700; margin-top: 4px; }
  .stat .sub { font-size: 11px; color: var(--muted-2); margin-top: 2px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .dot.ok { background: var(--up); } .dot.warn { background: var(--amber); } .dot.bad { background: var(--down); } .dot.neutral { background: var(--muted-2); }

  table.expiry { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.expiry th { text-align: left; padding: 9px 10px; color: var(--muted); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; border-bottom: 1px solid var(--border); }
  table.expiry td { padding: 11px 10px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  table.expiry tbody tr:last-child td { border-bottom: none; }
  .missing-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
  .tag { font-size: 11px; background: var(--amber-soft); color: var(--amber); border-radius: 5px; padding: 2px 7px; }
  .tag.none { background: var(--up-soft); color: #1f7a4d; }
  .empty-note { color: var(--muted-2); font-size: 12.5px; padding: 10px 0; }
</style>
</head>
<body>
<div class="topbar">
  <h1>Data Health</h1>
  <a class="navlink" href="/plan">Aaj ka Plan</a>
  <a class="navlink" href="/">Option Chain</a>
  <a class="navlink" href="/strategy">Strategy Builder</a>
  <a class="navlink" href="/journal">Journal</a>
  <a class="navlink" href="/range">Range Strategy</a>
  <a class="navlink" href="/diary">Range Diary</a>
  <a class="navlink" href="/simulator">Simulator</a>
  <a class="navlink" href="/charts">Charts</a>
  <a class="navlink" href="/iv">IV &amp; Skew</a>
  <a class="navlink active" href="/data-health">Data Health</a>
  <button class="primary" id="btnBackfill" style="margin-left:auto;" title="Run the evening history pull now (NIFTY + current expiry from Fyers, fills gaps)">Update Now</button>
</div>

<div class="page">
  <div class="card">
    <div class="panel-title"><h2>Daily History Update</h2></div>
    <div class="status-row" id="statusRow"></div>
  </div>

  <div class="card">
    <div class="panel-title"><h2>1-min History by Expiry (latest 15)</h2></div>
    <div id="expiryWrap"><div class="empty-note">Loading...</div></div>
  </div>
</div>

<script>
function fmtBytes(n) {
  if (n == null) return "—";
  if (n < 1024) return n + " B";
  if (n < 1024*1024) return (n/1024).toFixed(1) + " KB";
  return (n/1024/1024).toFixed(2) + " MB";
}
function fmtWhen(epochSec) {
  if (!epochSec) return "never";
  const d = new Date(epochSec * 1000);
  return d.toLocaleString("en-IN", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
}
function minutesAgo(epochSec) {
  if (!epochSec) return null;
  return (Date.now()/1000 - epochSec) / 60;
}
function isMarketHoursNow() {
  const n = new Date();
  const mins = n.getHours()*60 + n.getMinutes();
  const day = n.getDay();
  return day >= 1 && day <= 5 && mins >= 9*60+15 && mins <= 15*60+40;  // F&O close is 15:40 since 2026-08-03
}

function renderStatus(j) {
  // the evening job runs at 19:00 Mon-Fri: fresh = within ~a day (3.5 days over a weekend)
  const ago = minutesAgo(j.last_recorded_at);
  let freshDot = "bad", freshLabel = "never run";
  if (ago != null) {
    const h = ago / 60;
    freshLabel = h < 1 ? `${Math.round(ago)} min ago` : h < 48 ? `${Math.round(h)} h ago` : `${Math.round(h / 24)} days ago`;
    const limit = [0, 1].includes(new Date().getDay()) ? 84 : 30;  // Sun / Mon: last run was Friday evening
    freshDot = h <= limit ? "ok" : h <= limit + 48 ? "warn" : "bad";
  }

  const task = j.scheduled_task || {};
  let taskDot = "bad", taskLabel = "Not set up";
  if (task.exists) {
    // 267011 = Windows "task has not run yet" -- a fresh task, not a failure
    taskDot = [0, 267011, null, undefined].includes(task.last_result) ? "ok" : "warn";
    taskLabel = `Next run: ${fmtWhen(task.next_run)}`;
  }

  document.getElementById("statusRow").innerHTML = `
    <div class="stat">
      <div class="label">Last Update</div>
      <div class="value"><span class="dot ${freshDot}"></span>${freshLabel}</div>
      <div class="sub">${fmtWhen(j.last_recorded_at)}</div>
    </div>
    <div class="stat">
      <div class="label">Scheduled Task</div>
      <div class="value"><span class="dot ${taskDot}"></span>${task.exists ? "Active" : "Missing"}</div>
      <div class="sub">${taskLabel}</div>
    </div>
    <div class="stat">
      <div class="label">Storage Used</div>
      <div class="value">${fmtBytes(j.storage.total_bytes)}</div>
      <div class="sub">${j.storage.num_files} files</div>
    </div>
  `;
}

function renderExpiries(list) {
  const wrap = document.getElementById("expiryWrap");
  if (!list.length) { wrap.innerHTML = `<div class="empty-note">No expiries tracked yet.</div>`; return; }
  wrap.innerHTML = `
    <table class="expiry">
      <thead><tr><th>Expiry</th><th>Strikes</th><th>Days (expiry week)</th><th>Date Range</th><th>Missing Days</th></tr></thead>
      <tbody>
        ${list.map(e => `
          <tr>
            <td><b>${e.label}</b></td>
            <td>${e.num_instruments}</td>
            <td>${e.num_days}</td>
            <td>${e.first_date && e.last_date ? `${e.first_date} → ${e.last_date}` : "—"}</td>
            <td>
              ${e.missing_dates.length
                ? `<div class="missing-tags">${e.missing_dates.map(d => `<span class="tag">${d}</span>`).join("")}</div>`
                : `<span class="tag none">None</span>`}
            </td>
          </tr>`).join("")}
      </tbody>
    </table>`;
}

async function loadHealth() {
  const res = await fetch("/api/data_health");
  const j = await res.json();
  if (!j.ok) { document.getElementById("expiryWrap").innerHTML = `<div class="empty-note">Error: ${j.error}</div>`; return; }
  renderStatus(j);
  renderExpiries(j.expiries);
}

document.getElementById("btnBackfill").addEventListener("click", async (e) => {
  const btn = e.target;
  btn.disabled = true;
  btn.textContent = "Updating... (about a minute)";
  try {
    const res = await fetch("/api/data_health/backfill", {method: "POST"});
    const j = await res.json();
    if (!j.ok) { alert("Error: " + j.error); }
    else { alert(`Update done in ${j.status.seconds}s — current expiry ${j.status.current || "—"}${j.status.finalised ? `, ${j.status.finalised} expired week(s) finalised` : ""}.`); }
  } catch (err) {
    alert("Update failed: " + err);
  }
  btn.disabled = false;
  btn.textContent = "Update Now";
  loadHealth();
});

loadHealth();
setInterval(loadHealth, 30000);
</script>
</body>
</html>
